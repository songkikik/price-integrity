services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.6-alpine
    container_name: price-integrity-clickhouse
    ports:
      - "8123:8123"   # HTTP interface (dbt + clickhouse-connect 사용)
      - "9000:9000"   # Native TCP interface
    environment:
      CLICKHOUSE_DB: price_integrity
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./scripts/clickhouse-init:/docker-entrypoint-initdb.d
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  clickhouse_data:
