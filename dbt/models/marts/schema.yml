version: 2

models:
  - name: fct_crypto__price_spread
    description: |
      소스 간 가격 괴리(spread) 지표. cross-check 결과.
      Grain: (asset_code, ts_minute_utc) — 자산 × 분 1행.
      비즈니스 owner: 김기훈 (price-integrity). D3 정책상 동일 자산 코드 내에서만 비교.
      n_sources_active < 2 인 분은 spread_abs=0 (단일 소스라 괴리 없음). is_anomaly는 소스 2개 이상에서만 평가.
    columns:
      - name: asset_code
        description: "자산 코드 (v0.1은 'BTCKRW'). PK 구성 요소."
        tests:
          - not_null
      - name: ts_minute_utc
        description: "분 단위 시각 UTC. PK 구성 요소."
        tests:
          - not_null
      - name: n_sources_active
        description: "해당 분에 데이터가 들어온 소스 수."
        tests:
          - not_null
      - name: price_min
        description: "소스 간 최저가 (KRW)."
        tests:
          - not_null
      - name: price_max
        description: "소스 간 최고가 (KRW)."
        tests:
          - not_null
      - name: price_median
        description: "소스 간 중앙값 (KRW). spread_pct 분모."
        tests:
          - not_null
      - name: spread_abs
        description: "price_max - price_min (KRW)."
        tests:
          - not_null
      - name: spread_pct
        description: "spread_abs / price_median. 소스 간 상대 괴리율. nullable(median=0 시)."
      - name: is_anomaly
        description: "v0.1 단순 플래그: 소스 2개 이상 + spread_pct > 0.5%. severity·연속성 판정은 fct_crypto__anomaly_event 레이어 책임."
        tests:
          - not_null

  - name: fct_crypto__anomaly_event
    description: |
      소스 간 괴리가 임계를 넘은 '이상 이벤트' 감지 로그. 감지 = 결정론적/멱등 (D4).
      Grain: (asset_code, ts_minute_utc, rule_code) — 한 분에 warn·critical 둘 다 발화 시 각각 1행.
      비즈니스 owner: 김기훈 (price-integrity). 임계는 dbt var(anomaly_warn_pct/anomaly_critical_pct)로 파라미터화.
      cooldown·중복 억제는 여기 없음 → 통지 정책은 fct_crypto__notification_dispatch(미구현) 책임.
    columns:
      - name: asset_code
        description: "자산 코드 (v0.1은 'BTCKRW'). PK 구성 요소."
        tests:
          - not_null
      - name: ts_minute_utc
        description: "이벤트 발생 분(UTC). PK 구성 요소."
        tests:
          - not_null
      - name: rule_code
        description: "발화 룰 ('critical' | 'warn_2min'). PK 구성 요소."
        tests:
          - not_null
          - accepted_values:
              values: ['critical', 'warn_2min']
      - name: severity
        description: "심각도 ('critical' | 'warn')."
        tests:
          - not_null
          - accepted_values:
              values: ['critical', 'warn']
      - name: spread_pct
        description: "발화 시점의 소스 간 상대 괴리율."
        tests:
          - not_null
      - name: threshold_pct
        description: "해당 룰의 임계값 (발화 당시 var 값)."
        tests:
          - not_null

  - name: fct_crypto__notification_dispatch
    description: |
      anomaly_event 중 실제 알림 발송 대상만 선별한 통지 이력. 통지 = 정책 의존/비멱등 (D4).
      Grain: dispatch_id — 1 발송 결정 = 1행. append-only(incremental)로 이력 누적.
      비즈니스 owner: 김기훈 (price-integrity). cooldown은 dbt var(dispatch_*_cooldown_min).
      실제 Slack 발송은 dbt 밖(Python)이 이 테이블을 소비해 수행.
    columns:
      - name: dispatch_id
        description: "발송 식별자 (UUID). PK."
        tests:
          - not_null
          - unique
      - name: dispatched_at
        description: "발송 결정 시각 UTC."
        tests:
          - not_null
      - name: source_asset_code
        description: "원천 이벤트 자산 코드."
        tests:
          - not_null
      - name: source_ts_minute_utc
        description: "원천 이벤트 발생 분(UTC). cooldown watermark로도 사용."
        tests:
          - not_null
      - name: rule_code
        description: "발화 룰 ('critical' | 'warn_2min')."
        tests:
          - not_null
      - name: severity
        description: "심각도 ('critical' | 'warn')."
        tests:
          - not_null
      - name: spread_pct
        description: "발화 시점 괴리율."
        tests:
          - not_null
