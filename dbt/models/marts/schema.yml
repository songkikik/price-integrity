version: 2

models:
  - name: fct_crypto__price_spread
    description: |
      소스 간 가격 괴리(spread) 지표. cross-check 결과.
      Grain: (asset_code, ts_minute_utc) — 자산 × 분 1행.
      비즈니스 owner: 김기훈 (price-integrity). D3 정책상 동일 자산 코드 내에서만 비교.
      n_sources_active < 2 인 분은 spread_abs=0 (단일 소스라 괴리 없음). is_anomaly는 소스 2개 이상에서만 평가.
    columns:
      - name: asset_code
        description: "자산 코드 (v0.1은 'BTCKRW'). PK 구성 요소."
        tests:
          - not_null
      - name: ts_minute_utc
        description: "분 단위 시각 UTC. PK 구성 요소."
        tests:
          - not_null
      - name: n_sources_active
        description: "해당 분에 데이터가 들어온 소스 수."
        tests:
          - not_null
      - name: price_min
        description: "소스 간 최저가 (KRW)."
        tests:
          - not_null
      - name: price_max
        description: "소스 간 최고가 (KRW)."
        tests:
          - not_null
      - name: price_median
        description: "소스 간 중앙값 (KRW). spread_pct 분모."
        tests:
          - not_null
      - name: spread_abs
        description: "price_max - price_min (KRW)."
        tests:
          - not_null
      - name: spread_pct
        description: "spread_abs / price_median. 소스 간 상대 괴리율. nullable(median=0 시)."
      - name: is_anomaly
        description: "v0.1 단순 플래그: 소스 2개 이상 + spread_pct > 0.5%. severity·연속성은 anomaly_event 레이어(미구현)."
        tests:
          - not_null
