version: 2

sources:
  - name: raw
    description: "Python collector가 1분마다 적재하는 API 응답 원본 테이블"
    database: price_integrity
    schema: price_integrity
    tables:
      - name: raw_upbit__ticker
        description: |
          Upbit REST GET /v1/ticker?markets=KRW-BTC 응답 원본.
          collector가 ingested_at 시각 + raw_payload(JSON array[0]) 를 INSERT.
        columns:
          - name: ingested_at
            description: "collector INSERT 시각 (UTC)"
          - name: raw_payload
            description: |
              Upbit ticker 응답 JSON (array[0] 기준). 주요 필드:
              - trade_timestamp: 체결 시각 (Unix ms, INT). ts_utc 매핑 대상.
              - trade_price: 체결가 (FLOAT, KRW)
              - acc_trade_volume_24h: 24h 누적 거래량 (FLOAT, BTC)
              - timestamp: 응답 생성 시각 (Unix ms) — trade_timestamp와 별개

      - name: raw_bithumb__ticker
        description: |
          Bithumb REST GET /public/ticker/BTC_KRW 응답 원본.
          collector가 ingested_at 시각 + raw_payload(data 객체) 를 INSERT.
        columns:
          - name: ingested_at
            description: "collector INSERT 시각 (UTC)"
          - name: raw_payload
            description: |
              Bithumb ticker 응답 data 객체. 주요 필드:
              - closing_price: 현재가 (STRING, KRW). 사용 전 CAST 필요.
              - date: 서버 응답 시각 (Unix ms, STRING). trade_timestamp 없음 → D2 정책상 이 값을 ts_utc로 사용.
              - units_traded_24H: 24h 누적 거래량 (STRING, BTC)
              ※ 모든 숫자 필드가 STRING으로 반환됨 — stg에서 CAST 필수.
