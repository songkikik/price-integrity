version: 2

sources:
  - name: raw
    description: "Python collector가 1분마다 적재하는 API 응답 원본 테이블"
    database: price_integrity
    schema: price_integrity
    tables:
      - name: raw_upbit__ticker
        description: |
          Upbit REST GET /v1/ticker?markets=KRW-BTC 응답 원본.
          collector가 ingested_at 시각 + raw_payload(JSON array[0]) 를 INSERT.
        columns:
          - name: ingested_at
            description: "collector INSERT 시각 (UTC)"
          - name: raw_payload
            description: |
              Upbit ticker 응답 JSON (array[0] 기준). 주요 필드:
              - trade_timestamp: 체결 시각 (Unix ms, INT). ts_utc 매핑 대상.
              - trade_price: 체결가 (FLOAT, KRW)
              - acc_trade_volume_24h: 24h 누적 거래량 (FLOAT, BTC)
              - timestamp: 응답 생성 시각 (Unix ms) — trade_timestamp와 별개

      - name: raw_bithumb__ticker
        description: |
          Bithumb REST GET /public/ticker/BTC_KRW 응답 원본.
          collector가 ingested_at 시각 + raw_payload(data 객체) 를 INSERT.
        columns:
          - name: ingested_at
            description: "collector INSERT 시각 (UTC)"
          - name: raw_payload
            description: |
              Bithumb ticker 응답 data 객체. 주요 필드:
              - closing_price: 현재가 (STRING, KRW). 사용 전 CAST 필요.
              - date: 서버 응답 시각 (Unix ms, STRING). trade_timestamp 없음 → D2 정책상 이 값을 ts_utc로 사용.
              - units_traded_24H: 24h 누적 거래량 (STRING, BTC)
              ※ 모든 숫자 필드가 STRING으로 반환됨 — stg에서 CAST 필수.

      - name: raw_ws__ticker
        description: |
          WebSocket ticker 원본 (전 소스 공용 단일 테이블, source_code 컬럼으로 구분).
          ws_collector가 ingested_at + source_code + raw_payload(WS 메시지 원문 JSON) 를 INSERT.
          v0.3 5단계부터 포맷이 다른 소스(coinone·korbit)도 같은 테이블에 원문 그대로 적재하고,
          파싱은 포맷별 staging(stg_ws__ticker_*)이 담당. 구독응답·PONG 등 비데이터 메시지도 포함됨.
        columns:
          - name: ingested_at
            description: "collector INSERT 시각 (UTC)"
          - name: source_code
            description: "거래소 구분 ('upbit'|'bithumb'|'coinone'|'korbit'). payload엔 거래소 정보가 없어 이 컬럼이 유일한 출처."
          - name: raw_payload
            description: |
              WS 메시지 원문 JSON. 포맷이 소스별로 다름 —
              coinone: {response_type, channel, data:{last, timestamp, target_volume, ...}} (숫자 STRING)
              korbit:  {type, symbol, timestamp, snapshot?, data:{close, lastTradedAt, volume, ...}} (가격 STRING)
              upbit·bithumb (Upbit 표준) 주요 필드:
              - code: 마켓 코드 (STRING, 'KRW-BTC'). asset_code 매핑 대상.
              - trade_price: 체결가 (NUMBER, KRW). upbit=소수·bithumb=정수지만 JSONExtractFloat로 공통 처리.
              - trade_timestamp: 체결 시각 (Unix ms, INT). ts_utc 매핑 대상.
              - acc_trade_volume_24h: 24h 누적 거래량 (NUMBER, BTC)
              - stream_type: 'SNAPSHOT'(최초 1건) | 'REALTIME'(이후)
