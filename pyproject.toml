[project]
name = "price-integrity"
version = "0.1.0"
description = "실시간 시세 정합성 모니터링 — collector + alert + dbt"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "clickhouse-connect>=0.8",
    "python-dotenv>=1.0",
    "dbt-clickhouse>=1.8",
]

[dependency-groups]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
